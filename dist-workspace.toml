[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
# Intel macOS is deprecated (PR #10); Apple Silicon, Linux x64, Windows x64 only.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# User-writable bin dir, then PATH via the generated shell/PowerShell installer.
# CARGO_HOME is avoided so players do not need a Rust toolchain.
# OPENFELT_HOME overrides the default ~/.local/bin location.
install-path = ["$OPENFELT_HOME/bin", "~/.local/bin"]
# tar.gz extracts with the in-app updater without a system xz/zip library.
unix-archive = ".tar.gz"
windows-archive = ".tar.gz"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Pull requests validate the release graph without publishing artifacts.
pr-run-mode = "plan"

[dist.binaries]
aarch64-apple-darwin = ["openfelt"]
x86_64-unknown-linux-gnu = ["openfelt"]
x86_64-pc-windows-msvc = ["openfelt"]
