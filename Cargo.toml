[package]
name = "terminal-poker"
version = "1.0.1"
edition = "2021"
description = "OpenFelt: local play-money Hold'em learning with optional bring-your-own-key coaching"
license = "MIT"
repository = "https://github.com/jdavies69/openfelt"
keywords = ["poker", "terminal", "tui", "game", "training"]
categories = ["games", "command-line-utilities"]
homepage = "https://github.com/jdavies69/openfelt"
publish = false
default-run = "poker"

[package.metadata.dist]
dist = true

# Both binaries use the same source - users can run `terminal-poker` or `poker`
[[bin]]
name = "terminal-poker"
path = "src/main.rs"

[[bin]]
name = "poker"
path = "src/main.rs"

[[bin]]
name = "review-hand"
path = "src/bin/review_hand.rs"

[[bin]]
name = "review-multiway"
path = "src/bin/review_multiway.rs"

[[bin]]
name = "review-protocol"
path = "src/bin/review_protocol.rs"

[[bin]]
name = "review-table-actor"
path = "src/bin/review_table_actor.rs"

[[bin]]
name = "review-authorized-table"
path = "src/bin/review_authorized_table.rs"

[[bin]]
name = "review-network-client"
path = "src/bin/review_network_client.rs"

[[bin]]
name = "review-table-lifecycle"
path = "src/bin/review_table_lifecycle.rs"

[[bin]]
name = "poker-server"
path = "src/bin/poker_server.rs"

[[bin]]
name = "poker-client"
path = "src/bin/poker_client.rs"

[[bin]]
name = "poker-train"
path = "src/bin/poker_train.rs"

[[bin]]
name = "openfelt-replay"
path = "src/bin/openfelt_replay.rs"

[[bin]]
name = "openfelt-eval"
path = "src/bin/openfelt_eval.rs"

[[bin]]
name = "poker-benchmark"
path = "src/bin/poker_benchmark.rs"

[[bin]]
name = "poker-adversary"
path = "src/bin/poker_adversary.rs"

[[bin]]
name = "render-ui-concepts"
path = "src/bin/render_ui_concepts.rs"

[[bin]]
name = "sneakyblinders"
path = "src/bin/sneakyblinders.rs"

[[bin]]
name = "review-sprint14"
path = "src/bin/review_sprint14.rs"

[[bin]]
name = "review-sprint16"
path = "src/bin/review_sprint16.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
tar = "0.4"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
ratatui = "0.30.2"
ratatui-image = { version = "=11.0.8", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
crossterm = "0.29"
tachyonfx = "0.25.1"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
dirs = "5.0"
keyring = { version = "3.6.3", default-features = false }
sha2 = "0.10"
ctrlc = "3.4"
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "2.17"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-async-persistent", "tokio", "crypto-rust"] }

[profile.release]
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
